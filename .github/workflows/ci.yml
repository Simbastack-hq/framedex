name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.16"
          python-version: "3.12"

      - name: Install dev + test deps
        run: uv sync --locked --only-group dev --only-group test

      - name: ruff check
        run: uv run --no-sync ruff check src/framedex tests

      - name: ruff format
        run: uv run --no-sync ruff format --check src/framedex tests

      - name: mypy
        run: uv run --no-sync mypy src/framedex tests --ignore-missing-imports

      - name: pytest
        run: uv run --no-sync pytest

  # The fdx-mcp integration tests need the [mcp] extra (MCP SDK + Pillow); the
  # base job stays extras-free so the hermetic suite is proven on a bare install.
  mcp-extra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.16"
          python-version: "3.12"

      - name: Install dev + test deps + the mcp extra
        run: uv sync --locked --group dev --group test --extra mcp

      - name: mypy (with the SDK and Pillow installed)
        run: uv run --no-sync mypy src/framedex tests --ignore-missing-imports

      - name: pytest (mcp integration)
        run: uv run --no-sync pytest tests/test_mcp_integration.py tests/test_mcp_tools.py

  # fdx share's passcode crypto and pixel-level checks (GPS stripped, originals
  # untouched) need the [share] extra (Pillow, pillow-heif, cryptography).
  share-extra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.16"
          python-version: "3.12"

      - name: Install dev + test deps + the share extra
        run: uv sync --locked --group dev --group test --extra share

      - name: mypy (with Pillow and cryptography installed)
        run: uv run --no-sync mypy src/framedex tests --ignore-missing-imports

      - name: pytest (fdx share)
        run: uv run --no-sync pytest tests/test_share.py tests/test_share_site.py tests/test_share_lock.py tests/test_share_publish.py tests/test_share_edit.py tests/test_trips.py
